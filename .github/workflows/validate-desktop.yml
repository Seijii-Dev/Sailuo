name: Validate desktop diagnostics and cleanup safeguards
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Parse scripts without running setup or deleting files
        shell: pwsh
        run: |
          foreach($file in @('diagnose-desktop','keepalive','setup-media','optimize-storage','lib-common','record-screen','setup-tools-hub')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/$file.ps1",[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){throw ($errors | Out-String)}
          }
      - name: Compile dashboard source without running setup
        shell: pwsh
        run: |
          $lines=Get-Content scripts/setup-tools-hub.ps1
          $start=[Array]::IndexOf($lines, "`$csharpSource = @'")
          $end=[Array]::IndexOf($lines, "'@", $start + 1)
          if($start -lt 0 -or $end -le $start){throw 'Could not locate embedded dashboard C# source'}
          $sourcePath=Join-Path $env:RUNNER_TEMP 'SailuoDashboard-validation.cs'
          $outputPath=Join-Path $env:RUNNER_TEMP 'SailuoDashboard-validation.exe'
          $lines[($start + 1)..($end - 1)] | Set-Content -Path $sourcePath -Encoding ASCII
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if(-not (Test-Path $csc)){throw 'The .NET Framework C# compiler was not found'}
          & $csc /nologo /target:winexe "/out:$outputPath" /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll $sourcePath
          if($LASTEXITCODE -ne 0){throw "Dashboard C# compilation failed with exit code $LASTEXITCODE"}
      - name: Verify protected paths with deletion mocked
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/optimize-storage.ps1",[ref]$tokens,[ref]$errors)
          $fn=$ast.Find({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Remove-Tree'},$true)
          Invoke-Expression $fn.Extent.Text
          function Log($m){Write-Host $m}
          $script:deletions=0
          function Remove-Item {$script:deletions++;throw 'Deletion disabled in validation'}
          foreach($path in @("$env:SystemRoot", "$env:SystemRoot\System32", "$env:SystemRoot\WinSxS", "$env:SystemRoot\Installer", "$env:SystemRoot\Temp", "$env:ProgramFiles\Tailscale", 'C:\ProgramData\Sailuo')) {
            if((Remove-Tree $path 'protected test') -ne 0){throw 'Protected target was not rejected'}
          }
          if($script:deletions){throw 'Deletion was attempted on protected path'}
      - name: Run read-only desktop diagnostics
        shell: pwsh
        run: |
          ./scripts/diagnose-desktop.ps1
          $report=Get-ChildItem 'C:\ProgramData\Sailuo\Diagnostics\desktop-*.json' | Select-Object -Last 1
          if(-not $report){throw 'Report missing'}
          $data=Get-Content $report -Raw | ConvertFrom-Json
          if(-not $data.os -or $data.runtimes.Count -lt 12){throw 'Report incomplete'}
          Write-Host 'Local report structure verified; no file uploaded and no desktop restart.'
