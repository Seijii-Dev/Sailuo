# rdpfree-workflow-schema: 6
name: RdpFree — 6-Hour RDP

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Session duration (minutes, 10-360)'
        required: false
        default: '360'
        type: string
      hostname:
        description: 'VM hostname prefix'
        required: false
        default: 'rdpfree'
        type: string
      rdp_user:
        description: 'RDP username (3-20 characters)'
        required: false
        default: 'xyadmin'
        type: string
      access:
        description: 'Private access path to RDP'
        required: false
        default: 'tailscale'
        type: choice
        options:
          - tailscale
          - portmap
      storage_boost:
        description: 'Clear the toolcache for extra disk space'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      debloat:
        description: 'Background service cleanup mode'
        required: false
        default: 'light'
        type: choice
        options:
          - light
          - full
          - none
      windows10:
        description: 'Apply the Windows 10 visual style'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      xydesk:
        description: 'Enable XyDesk Remote host tuning (AVC444 + ClearType + audio)'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      extras:
        description: 'Install extra applications (7-Zip, Chrome, Lightshot, wallpaper)'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      runner:
        description: 'Runner OS and image (Windows / Linux Desktop / plain Linux)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - windows-2022
          - windows-2025
          - windows-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-latest
      linux_mode:
        description: 'Linux mode (desktop = XFCE4 GUI XRDP :3389, plain = SSH server without XFCE4 :22/:3389)'
        required: false
        default: 'desktop'
        type: choice
        options:
          - desktop
          - plain
      microphone:
        description: 'Enable RDP microphone and camera redirection'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      auto_renew:
        description: 'Automatically continue into the next session when time expires (data is preserved)'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      portmap_host:
        description: 'Public Portmap.io host (optional)'
        required: false
        default: ''
        type: string
      portmap_port:
        description: 'Public Portmap.io port (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: rdpfree-active-session
  cancel-in-progress: false

jobs:
  rdp:
    name: RDP session (${{ inputs.runner || 'windows-2022' }})
    runs-on: ${{ inputs.runner || 'windows-2022' }}
    timeout-minutes: 360
    env:
      DURATION_MINUTES: ${{ inputs.duration_minutes || '360' }}
      HOSTNAME: ${{ inputs.hostname || 'rdpfree' }}
      RDP_USER: ${{ inputs.rdp_user || 'xyadmin' }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      ACCESS: ${{ inputs.access || 'tailscale' }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      PORTMAP_OVPN_CONFIG: ${{ secrets.PORTMAP_OVPN_CONFIG }}
      PORTMAP_HOST: ${{ inputs.portmap_host || vars.PORTMAP_HOST }}
      PORTMAP_PORT: ${{ inputs.portmap_port || vars.PORTMAP_PORT }}
      STORAGE_BOOST: ${{ inputs.storage_boost || 'yes' }}
      DEBLOAT: ${{ inputs.debloat || 'light' }}
      WINDOWS10: ${{ inputs.windows10 || 'yes' }}
      XYDESK: ${{ inputs.xydesk || 'yes' }}
      EXTRAS: ${{ inputs.extras || 'yes' }}
      LINUX_MODE: ${{ inputs.linux_mode || 'desktop' }}
      MICROPHONE: ${{ inputs.microphone || 'yes' }}
      AUTO_RENEW: ${{ inputs.auto_renew || 'yes' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ======================================================================
      # LINUX DESKTOP RDP / PLAIN LINUX SSH VPS (Ubuntu 24.04 / 22.04 / Latest)
      # ======================================================================
      - name: Set up base RDP and Linux access (XRDP :3389 / SSH :22 + Tailscale)
        if: ${{ startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: bash
        run: |
          chmod +x ./scripts/setup-linux-rdp.sh
          ./scripts/setup-linux-rdp.sh --setup-only

      - name: Keep the session alive (keepalive + 15-minute autosave) [Linux]
        if: ${{ startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: bash
        run: ./scripts/setup-linux-rdp.sh --keepalive-only

      - name: Finalize (stop session and clear status) [Linux]
        if: ${{ always() && startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: bash
        continue-on-error: true
        run: ./scripts/setup-linux-rdp.sh --finalize-only

      # ======================================================================
      # WINDOWS DESKTOP RDP (Windows Server 2022 / 2025 / Latest)
      # ======================================================================
      - name: Clean up previous runs
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/cleanup-actions.ps1

      - name: Set up base RDP (user + port 3389)
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        run: ./scripts/setup-rdp.ps1

      - name: Restore the previous session snapshot
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/restore-state.ps1

      - name: Optimize runner storage
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && ((inputs.storage_boost || 'yes') != 'no' || (inputs.debloat || 'light') != 'none') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/optimize-storage.ps1

      - name: Windows 10 look and dark mode
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.windows10 || 'yes') != 'no' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-win10.ps1

      - name: Explorer and desktop tweaks
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-explorer.ps1

      - name: RDP audio and camera
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.microphone || 'yes') != 'no' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-media.ps1

      - name: Extra applications (7-Zip, Chrome, Lightshot, wallpaper)
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.extras || 'yes') != 'no' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-extras.ps1

      - name: XyDesk Remote host setup
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.xydesk || 'yes') != 'no' }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/setup-xydesk.ps1

      - name: Set up Tailscale access (enabled last, once everything is ready)
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && (inputs.access || 'tailscale') == 'tailscale' }}
        shell: pwsh
        run: ./scripts/setup-access.ps1

      - name: Set up Portmap OpenVPN access (enabled last, once everything is ready)
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') && inputs.access == 'portmap' }}
        shell: pwsh
        run: ./scripts/setup-portmap.ps1

      - name: Publish ready status (after all applications are ready)
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/publish-status.ps1

      - name: Keep the session alive (keepalive + 15-minute autosave)
        if: ${{ !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        run: ./scripts/keepalive.ps1

      - name: Save the session (persist-state.ps1)
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/persist-state.ps1

      - name: Upload the session snapshot
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xyrdp-state
          path: C:\XyRDP\persist\xyrdp-state.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Finalize (stop the session and clear status)
        if: ${{ always() && !startsWith(inputs.runner || 'windows-2022', 'ubuntu') }}
        shell: pwsh
        continue-on-error: true
        run: ./scripts/finalize-rdp.ps1

      - name: Chain the next session (auto-renew without starting over)
        if: ${{ success() && (inputs.auto_renew || 'yes') != 'no' }}
        shell: pwsh
        continue-on-error: true
        run: |
          $hdr = @{
            Authorization          = "Bearer $($env:GITHUB_TOKEN)"
            Accept                 = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent'           = 'XyRDP-AutoRenew'
          }
          $body = @{
            ref    = 'main'
            inputs = @{
              duration_minutes = "$($env:DURATION_MINUTES)"
              hostname         = "$($env:HOSTNAME)"
              rdp_user         = "$($env:RDP_USER)"
              access           = "$($env:ACCESS)"
              storage_boost    = "$($env:STORAGE_BOOST)"
              debloat          = "$($env:DEBLOAT)"
              windows10        = "$($env:WINDOWS10)"
              xydesk           = "$($env:XYDESK)"
              extras           = "$($env:EXTRAS)"
              runner           = "${{ inputs.runner || 'windows-2022' }}"
              linux_mode       = "$($env:LINUX_MODE)"
              microphone       = "$($env:MICROPHONE)"
              auto_renew       = "$($env:AUTO_RENEW)"
              portmap_host     = "$($env:PORTMAP_HOST)"
              portmap_port     = "$($env:PORTMAP_PORT)"
            }
          } | ConvertTo-Json -Depth 5
          try {
            # Anti-suspend guard for new GitHub accounts:
            # 1) Check the repository owner's account age. If the account is younger than 7 days,
            #    skip the self-retrigger loop, which GitHub's automation detection treats as a bot loop.
            # 2) Wait a polite random jitter (15-25 seconds) before triggering the next session.
            $ownerName = ($env:GITHUB_REPOSITORY -split '/')[0]
            $allowAutoRenew = $true
            try {
              $usrObj = Invoke-RestMethod -Uri "https://api.github.com/users/$ownerName" -Headers $hdr -TimeoutSec 15
              if ($usrObj -and $usrObj.created_at) {
                $ageDays = ([DateTime]::UtcNow - [DateTime]::Parse($usrObj.created_at).ToUniversalTime()).TotalDays
                if ($ageDays -lt 7) {
                  Write-Host "Anti-suspend guard: @$ownerName is still $([math]::Round($ageDays,1)) days old (< 7 days). Auto-retrigger skipped to protect a new account (start the next session manually from the app)."
                  $allowAutoRenew = $false
                }
              }
            } catch {}

            if ($allowAutoRenew) {
              Start-Sleep -Seconds (Get-Random -Mthismum 15 -Maximum 26)
              Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/rdp-6h.yml/dispatches" `
                -Headers $hdr -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 20 | Out-Null
              Write-Host 'The next session was scheduled automatically (this session is already saved).'
            }
          } catch {
            Write-Host "Auto-renew skipped: $($_.Exception.Message)"
          }
